# conf.d is included in nginx's http context.
map $http_upgrade $trace_connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # The optional Compose frontend uses relative /api and /socket.io URLs.
  # Keep their complete URI, query, authorization and request body intact.
  # The app still owns authentication, file limits and resource permissions.
  location ~ ^/(api|socket\.io)(/|$) {
    # Multi-document requests may contain several independently limited files.
    # Delegate those limits to Multer rather than impose another aggregate cap.
    client_max_body_size 0;
    proxy_pass http://backend:3300;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $trace_connection_upgrade;
    proxy_read_timeout 75s;
  }

  # Single-page app: every unmatched path must return index.html, or a direct
  # hit on /reset-password?token=... — the link the password-reset email sends
  # — 404s. The same applies to refreshing /dashboard.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed build assets are immutable; index.html must never be cached or
  # clients keep booting an old bundle after a deploy.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
